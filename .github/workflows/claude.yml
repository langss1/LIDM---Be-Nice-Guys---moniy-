name: Claude

# Dipanggil dengan menyebut @claude di issue atau komentar PR.
# Auth memakai token langganan (CLAUDE_CODE_OAUTH_TOKEN), bukan API key per-token.
# Ganti baris claude_code_oauth_token dengan anthropic_api_key kalau pindah ke API key.

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened]

# Satu run per issue/PR PER AKTOR. Komentar susulan dari orang yang sama
# membatalkan run lamanya -> hemat menit.
#
# JANGAN hapus ${{ github.actor }} dari group.
# Tanpa itu, komentar status "Claude Code is working..." yang diposting bot
# memicu run issue_comment baru yang SEKELOMPOK dengan run yang sedang jalan,
# lalu cancel-in-progress membunuh Claude di tengah kerja. Terjadi 2026-09-03
# di Deep-Research issue #2: run A cancelled, run B skipped, tidak ada hasil.
# concurrency dievaluasi di level run, SEBELUM 'if' di level job - jadi pagar
# 'if' di bawah tidak bisa mencegahnya.
concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number }}-${{ github.actor }}
  cancel-in-progress: true

jobs:
  claude:
    # Gerbang biaya + pagar aktor: runner hanya nyala kalau '@claude' disebut
    # OLEH pemilik repo. Kolaborator lain tetap punya akses penuh ke repo -
    # yang dibatasi hanya pemicu workflow ini, supaya kuota langganan tidak
    # terpakai orang lain. Login bot juga bukan 'langss1', jadi ikut tersaring.
    if: >
      github.event.sender.login == 'langss1' && (
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
      )
    runs-on: ubuntu-latest
    timeout-minutes: 20        # sabuk pengaman kalau job nyangkut
    permissions:
      contents: write          # ubah file & push branch
      pull-requests: write     # bikin PR
      issues: write            # balas di issue
      id-token: write          # wajib: auth GitHub App bawaan action
      actions: read            # baca hasil CI di PR
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Nama branch tanpa timestamp -> 'claude/issue-7-perbaiki-form-login',
          # bukan 'claude/issue-7-1757142033'. Dipasangkan dengan setelan repo
          # "Automatically delete head branches", branch hilang begitu PR di-merge,
          # jadi nama bersih ini bisa dipakai ulang dan tidak pernah menumpuk.
          #
          # CATATAN: action TIDAK bisa dipaksa memakai satu branch tetap. Kalau
          # nama yang dihasilkan sudah ada di remote, dia sengaja jatuh ke format
          # timestamp (src/github/operations/branch.ts). Jangan coba menguncinya.
          branch_name_template: "{{prefix}}{{entityType}}-{{entityNumber}}-{{description}}"
          # Satu komentar status yang di-update, bukan komentar baru tiap langkah.
          use_sticky_comment: "true"
          # claude_args: "--max-turns 15"   # aktifkan kalau run terasa boros
